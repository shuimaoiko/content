<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenRouter STT workflow with Sapat in Daytona</title>
  <desc id="desc">A Daytona workspace runs Sapat, encodes audio as base64 JSON, sends it to OpenRouter, routes to an STT model, and saves transcript output.</desc>
  <rect width="1120" height="560" fill="#f8fafc"/>
  <rect x="54" y="78" width="240" height="118" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="174" y="121" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#111827">Daytona workspace</text>
  <text x="174" y="153" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#4b5563">Python, ffmpeg, Sapat</text>
  <rect x="354" y="78" width="240" height="118" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="474" y="121" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#115e59">OpenRouter provider</text>
  <text x="474" y="153" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#4b5563">base64 JSON payload</text>
  <rect x="654" y="78" width="240" height="118" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="774" y="121" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#312e81">OpenRouter STT</text>
  <text x="774" y="153" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#4b5563">model routing and usage</text>
  <rect x="804" y="338" width="240" height="118" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="924" y="381" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#881337">STT model</text>
  <text x="924" y="413" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#4b5563">Whisper, GPT-4o, Qwen</text>
  <rect x="204" y="338" width="240" height="118" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="324" y="381" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#78350f">Transcript file</text>
  <text x="324" y="413" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#4b5563">Review, compare, archive</text>
  <rect x="504" y="338" width="240" height="118" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="624" y="381" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#155e75">Validation loop</text>
  <text x="624" y="413" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#4b5563">Mock tests + sample clips</text>
  <path d="M294 137 H354" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M594 137 H654" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M824 196 C900 245 930 290 924 338" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M804 397 H744" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M504 397 H444" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M324 338 C238 299 191 249 174 196" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
